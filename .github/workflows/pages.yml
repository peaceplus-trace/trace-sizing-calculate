# Builds the sizing report from config/trace_workload.toml and publishes it to
# GitHub Pages. Needs Settings -> Pages -> Source: "GitHub Actions".
name: Publish sizing report

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Test (don't publish a report from broken code)
        run: python -m pytest -q
      - name: Build report
        run: |
          mkdir -p site
          trace-sizing config/trace_workload.toml --format html -o site/index.html
          trace-sizing config/trace_workload.toml --format md -o site/report.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
