# TRACE workload parameters - the input config for the sizing calculator.
#
# [iot] and [hsi] are the canonical 11-parameter "System Parameters" table
# used across the TRACE chats (IoT #1-6, HSI #7-11); the number in each
# comment is that parameter's # in the table. Edit the values below to match
# the current plan; everything else (Kafka/Flink/Prometheus/VMs/sizing) can
# be left as-is, overridden here, or overridden per run with --set.
#
# Currently set to the pilot plan from the TRACE WP3 cost-estimate doc:
# 10 sites, 50 sensors/site, 48 HSI scans/site/day. Values here equal the
# tool's built-in defaults, so this file and omitting it give the same result
# until you change something.
#
# Run it with:
#   trace-sizing config/trace_workload.toml

[iot]
pilot_sites = 10                # 1  Pilot site count
sensors_per_site = 50           # 2  Sensor count per site
reporting_interval_s = 30       # 3  Reporting interval (s)
message_bytes = 500             # 4  Message size (bytes/reading)
operating_hours_per_day = 24    # 5  Operating hours (24 if 24/7)
operating_days_per_year = 365   # 6  Operating days per year

[hsi]
sites_with_camera = 10          # 7  Number of sites with HSI camera
cube_mb = 200                   # 8  Image size (cube size, MB) - or set pixels/lines/bands/bytes_per_value
scans_per_sample = 1            # 9  Scans per sample (incl. repeats/reference scans)
samples_per_day = 48            # 10 Number of samples per day (per HSI site)
operating_days_per_year = 260   # 11 HSI operating days per year (weekdays)
# Not one of the 11 parameters - only used for the peak upload-rate estimate.
upload_window_hours_per_day = 8
pointer_event_bytes = 500
claim_check = true              # cubes -> S3, only pointer events -> Kafka

[kafka]
retention_days = 7
replication_factor = 3
brokers = 3
ram_gb_per_broker = 2
vcpu_per_broker = 1

[flink]
window_s = 3600
state_bytes_per_reading = 100
checkpoints_retained = 3
cpu_us_per_event = 50
jobmanager_gb = 1.6
taskmanager_gb = 1.7
vcpu = 1

[prometheus]
scrape_interval_s = 15
retention_days = 15
metrics_per_sensor = 8
hsi_metrics_per_site = 4
infrastructure_series = 9600
store_sensor_values = true
bytes_per_sample = 1.5
ram_kb_per_series = 4
process_overhead_mb = 150

[grafana]
ram_gb = 0.25
vcpu = 0.25
disk_gb = 0.1

[alerting]                      # Alertmanager + exporters
ram_gb = 0.25
vcpu = 0.2
disk_gb = 0.1

# Streaming hot store (Real-time Inference branch): latest reading + prediction
# per sensor/HSI site, overwritten in place. The separate CKAN Redis instance
# isn't modeled - add it under [[extra_components]] if you need it sized too.
[redis]
bytes_per_key = 300
ram_overhead_mb = 50
vcpu = 0.25
min_disk_gb = 0.1

# Bronze/Silver/Gold volume (TRACE Data Lake pipeline branch) and the AI/ML
# Pipeline (Real-time Inference branch). Informational only - S3/Glue aren't
# part of the VM fleet, so this doesn't affect VM fit, only the sizing report.
# Silver is set to store HSI feature vectors/indices only, not a second full
# cube - confirm this matches your actual Silver ETL design.
[lakehouse]
bronze_iot_size_ratio = 1.0       # 1.0 = landed as raw JSON; lower if converted to Parquet on write
silver_iot_size_ratio = 0.3       # conformed/deduped Parquet vs raw IoT bytes
silver_hsi_kb_per_cube = 10       # spectral indices/calibration stats/QC flags only
gold_iot_rows_per_sensor_per_day = 24   # hourly aggregates
gold_iot_bytes_per_row = 80
gold_hsi_bytes_per_record = 1500        # per-sample score/classification + rollups
iceberg_tables = 3                      # Bronze + Silver + Gold
iceberg_commit_interval_min = 15
iceberg_metadata_kb_per_commit = 20
iceberg_objects_per_commit = 3          # manifest list + manifest file + metadata.json snapshot

[ml]
model_variants = 5                # e.g. per site-group or crop type
model_mb_per_variant = 10         # tabular/LSTM-style model over Silver features
model_versions_retained = 3
predictions_per_sensor_per_day = 24     # written back at Gold's aggregate cadence
predictions_per_hsi_sample = 1
prediction_bytes = 100

# S3 retention policy: which tier each stream sits in, by age (days).
# Raw HSI: S3 Standard until hsi_standard_days, Glacier Instant Retrieval until
# hsi_glacier_ir_until_days, then Deep Archive. Raw IoT: one tier for life
# (glacier_ir is a shortcut, since it's small). Silver and Gold: Standard for
# the whole project, plus silver_gold_overhead for versioning and snapshots.
[storage]
hsi_standard_days = 30
hsi_glacier_ir_until_days = 365
iot_raw_tier = "glacier_ir"       # "standard" | "glacier_ir" | "deep_archive"
silver_gold_overhead = 0.10

[sizing]
disk_headroom = 0.5
os_ram_gb_per_vm = 1
os_disk_gb_per_vm = 20
project_months = 36
# Months of data to keep across all services (S3/Iceberg storage), not
# Kafka's or Prometheus's own short operational retention set above.
# Leave unset (or "none") to keep everything for the whole project; set it
# below project_months to see storage plateau at a rolling window instead
# of growing for the full 36 months.
# retention_months = 12
scale_factors = [0.1, 0.5, 1, 2, 10, 100]

# Fleet to check the totals against (4 vCPU / 16 GiB each)
[[vms]]
name = "portal"
vcpu = 4
ram_gib = 16
disk_gb = 100

[[vms]]
name = "data-plane"
vcpu = 4
ram_gib = 16
disk_gb = 100

[[vms]]
name = "app"
vcpu = 4
ram_gib = 16
disk_gb = 50

# Components the model does not derive. Fill in once measured, then they
# are included in the totals and the VM fit check.
