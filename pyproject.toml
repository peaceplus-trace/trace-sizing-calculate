[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-sizing"
version = "0.1.0"
description = "Resource sizing calculator for the TRACE WP3 platform (Kafka, Flink, Prometheus, HSI/IoT ingest)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trace-sizing = "trace_sizing.cli:main"
trace-cost = "trace_sizing.cost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
